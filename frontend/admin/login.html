<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin sign in — Project X</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<style>
body{margin:0;background:#0c131a}
a{color:#eef4f8}a:hover{opacity:.85}
</style>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png"/>
<link rel="apple-touch-icon" href="/assets/favicon-180.png"/>
<meta name="theme-color" content="#0c131a"/>
<meta name="robots" content="noindex, nofollow"/>
</head>
<body>
<div style="position: relative; min-height: 100vh; background: #0c131a; color: #eef4f8; font-family: Montserrat, system-ui, sans-serif; display: flex; align-items: center; justify-content: center; padding: 48px 16px; box-sizing: border-box; overflow: hidden"><img alt="" aria-hidden="true" src="../assets/rowhouses.jpg" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover"/><div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(8,14,20,0.72)"></div>
<div style="position: relative; width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 28px">
<img alt="Project X Contractors LLC" src="../assets/logo.png" style="display: block; height: 104px; width: auto"/>
<form style="background: #142029; border: 1px solid #263644; padding: 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 800; letter-spacing: 0.18em; color: #3fb0d8">PROJECTX.BUILD/ADMIN</span><h1 style="margin: 0; font-size: 28px; line-height: 34px; font-weight: 800">Sign in</h1><p style="margin: 0; font-size: 14px; line-height: 22px; color: #9fb0bf">Staff only. Use the work email you were invited with.</p></div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="l-email" style="font-size: 11px; font-weight: 800; letter-spacing: 0.14em">EMAIL</label><input id="l-email" placeholder="you@projectx.build" style="font: inherit; font-size: 15px; color: #eef4f8; background: #0c131a; border: 1px solid #6f8494; min-height: 48px; padding: 0 14px; box-sizing: border-box; width: 100%" type="email"/></div>
<div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><label for="l-pass" style="font-size: 11px; font-weight: 800; letter-spacing: 0.14em">PASSWORD</label><input id="l-pass" placeholder="••••••••" style="font: inherit; font-size: 15px; color: #eef4f8; background: #0c131a; border: 1px solid #6f8494; min-height: 48px; padding: 0 14px; box-sizing: border-box; width: 100%" type="password"/></div>
<label style="display: flex; gap: 10px; align-items: center; font-size: 14px; min-height: 44px"><input style="width: 20px; height: 20px; accent-color: #3fb0d8" type="checkbox"/> Keep me signed in on this device</label>
<a href="/admin/dashboard" style="display: flex; align-items: center; justify-content: center; min-height: 52px; background: #3fb0d8; color: #08131a; text-decoration: none; font-size: 13px; font-weight: 800; letter-spacing: 0.12em">SIGN IN</a>
<a href="#" style="font-size: 13px; color: #9fb0bf; align-self: center">Forgot password?</a>
</form>
<div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 13px; color: #9fb0bf">Access by role: <span style="display: inline-block; white-space: nowrap; font-size: 12px; line-height: 16px; font-weight: 700; padding: 4px 10px; color: #3fb0d8; background: #12303f">Owner</span><span style="display: inline-block; white-space: nowrap; font-size: 12px; line-height: 16px; font-weight: 700; padding: 4px 10px; color: #9cc3ff; background: #16263d">Office</span><span style="display: inline-block; white-space: nowrap; font-size: 12px; line-height: 16px; font-weight: 700; padding: 4px 10px; color: #72cf9a; background: #11301f">Field</span></div>
</div>
</div>
</body>
</html>
